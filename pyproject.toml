[project]
name = "nvol"
version = "0.1.0"
description = "Native Vector Operations Library: verified SIMD operation libraries for C, C++, Rust, Python (and Odin)"
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
nvol = "nvol.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nvol*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
